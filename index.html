<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#202124">
<title>AREWA DATA PLUG</title>
<style>
:root{--accent:#ff8a24;--accent2:#f97316;--bg:#17181b;--card:#23252a;--text:#f4f4f5;--muted:#a1a1aa;--border:#383a40;--input:#202226;--header:#202124;--soft:#34281f}
body[data-theme="light"]{--bg:#f4f5f7;--card:#ffffff;--text:#202124;--muted:#687078;--border:#e0e2e6;--input:#ffffff;--header:#202124;--soft:#fff0e2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:none;max-width:480px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:85px}
.header{background:var(--header);color:white;padding:24px 20px 28px;border-radius:0 0 26px 26px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;background:var(--accent);color:#202124;display:grid;place-items:center;border-radius:14px;font-size:24px;font-weight:bold}
.brand h1{font-size:18px;line-height:1.4}
.greeting{margin-top:26px}
.greeting p{color:#d5e8df;font-size:13px}
.greeting h2{font-size:22px;margin-top:7px}
main{padding:18px}
.balance-card{background:linear-gradient(135deg,#202124,#34363d);border:1px solid #ff8a2466;color:white;padding:23px;border-radius:22px;margin-top:-2px;box-shadow:0 8px 24px #0002}
.balance-top{display:flex;justify-content:space-between;align-items:center}
.balance-label{color:#d5e8df;font-size:13px}
.balance{font-size:30px;font-weight:bold;margin-top:12px}
.badge{background:#ffffff20;padding:7px 10px;border-radius:20px;font-size:11px}
.balance-actions{display:flex;gap:10px;margin-top:22px}
.balance-actions button{flex:1;padding:12px 8px;border:1px solid #ffffff55;background:#ffffff12;color:white;border-radius:12px;font-weight:bold}
.balance-actions button:first-child{background:var(--accent);color:#202124;border-color:var(--accent)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}
.section-title h3{font-size:17px}
.section-title button{background:none;border:0;color:var(--accent);font-size:13px;font-weight:bold}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.service{border:1px solid var(--border);border-radius:17px;background:var(--card);padding:17px 5px;text-align:center;color:var(--text)}
.service .icon{width:47px;height:47px;margin:0 auto 10px;display:grid;place-items:center;background:var(--soft);border-radius:15px;font-size:23px}
.service h4{font-size:12px}
.service p{color:var(--muted);font-size:10px;margin-top:5px}
.notice,.info-box{margin-top:15px;padding:14px;border-radius:12px;background:var(--soft);color:var(--text);border:1px solid #ff8a2440;font-size:12px;line-height:1.7}
.transaction-list,.panel{background:var(--card);border:1px solid var(--border);border-radius:17px;overflow:hidden}
.panel{padding:20px;margin-top:5px}
.panel h2{font-size:20px;margin-bottom:8px}
.panel>p{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:20px}
.page{display:none}
.page.active{display:block}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:8px}
.field input,.field select{width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--input);color:var(--text)}
.primary-btn,.secondary-btn{width:100%;border:0;border-radius:12px;padding:15px;background:var(--accent);color:#202124;font-weight:bold;margin-top:4px}
.secondary-btn{border:1px solid var(--accent);background:var(--card);color:var(--accent);margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:13px;line-height:1.7}
.footer{text-align:center;padding:25px 10px;font-size:10px;color:var(--muted)}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:none;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--border);padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:10}
.nav-btn{border:0;background:transparent;color:var(--muted);padding:5px 0;font-size:11px;display:grid;gap:5px;justify-items:center}
.nav-btn span{font-size:21px}
.nav-btn.active{color:var(--accent);font-weight:bold}
.auth-wrap{max-width:420px;margin:30px auto;padding:18px}
.auth-card{background:var(--card);color:var(--text);padding:24px;border-radius:18px;box-shadow:0 4px 20px #0001}
.auth-card h1{text-align:center;color:var(--accent);font-size:22px;margin-bottom:8px}
.auth-card>p{text-align:center;color:var(--muted);margin-bottom:20px;font-size:13px}
.auth-card h2{font-size:18px;margin-bottom:14px}
.auth-card input{width:100%;padding:13px;margin:7px 0;border:1px solid var(--border);border-radius:10px;background:var(--input);color:var(--text)}
.auth-card button{width:100%;padding:13px;margin-top:9px;border:0;border-radius:10px;background:var(--accent);color:#202124;font-weight:bold}
.auth-card button.secondary{background:var(--soft);color:var(--text)}
#auth-status{margin-top:12px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.top-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}
.top-actions button{border:1px solid #ff8a2466;background:#ffffff15;color:white;padding:8px 12px;border-radius:10px}
#admin-transactions{max-height:520px;overflow:auto}
.service:active,.nav-btn:active{transform:scale(.98)}
body[data-theme="light"] .auth-card button.secondary{background:#fff0e2}
@media(max-width:350px){main{padding:12px}.services{gap:7px}.service h4{font-size:11px}.balance{font-size:26px}}
</style>
</head>
<body>
<!-- Login/Register -->
<div class="auth-wrap" id="auth-wrap">
  <div class="auth-card">
    <h1>AREWA DATA PLUG</h1>
    <p>Data, airtime, bills and digital services</p>
    <h2 id="auth-title">Create Account / Rijista</h2>
    <form id="signup-form">
      <input id="signup-name" type="text" placeholder="Full Name / Cikakken Suna" autocomplete="name" required>
      <input id="signup-phone" type="tel" placeholder="Phone Number / Lambar Waya" autocomplete="tel" required>
      <input id="signup-email" type="email" placeholder="Email Address" autocomplete="email" required>
      <input id="signup-password" type="password" placeholder="Create Password (at least 8 characters)" autocomplete="new-password" minlength="8" required>
      <button type="submit">Create Account / Yi Rijista</button>
    </form>
    <form id="login-form" style="display:none">
      <input id="login-email" type="email" placeholder="Email Address" autocomplete="email" required>
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Login / Shiga</button>
    </form>
    <button class="secondary" id="toggle-auth" type="button">Already registered? Login</button>
    <button class="secondary" id="forgot-password" type="button">Forgot Password?</button>
    <div id="auth-status" role="status" aria-live="polite"></div>
  </div>
</div>
